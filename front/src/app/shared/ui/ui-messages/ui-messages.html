<div class="fixed top-4 right-4 z-50 flex flex-col gap-2">
  @if (ui.successMessage(); as message) {
    <p class="bg-green-600 text-white p-3 rounded shadow-lg">
      {{ message }}
    </p>
  }

  @if (ui.errorMessage(); as message) {
    <p class="bg-red-600 text-white p-3 rounded shadow-lg">
      {{ message }}
    </p>
  }
</div>
