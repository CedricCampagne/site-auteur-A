<section class="flex flex-col gap-6 mt-24 pb-8 border-b">
  <div class="flex flex-col border-b-2 border-accent2 py-2 md:flex-row md:justify-between">
    <h2 class="text-2xl sm:text-4xl font-black text-center mb-4">
      Tous les commentaires ({{ comments().length }})
    </h2>
  </div>

  <div
    class="border-b-2 border-accent2 pb-2 flex flex-col items-center gap-2 md:flex-row md:justify-around md:items-center"
  >
    <div
      class="flex flex-col items-center gap-2 border border-accent2 py-3 px-4 rounded-md bg-white shadow-sm w-fit md:items-baseline"
    >
      <p class="text-sm font-semibold text-accent2">
        Filtrer par chronique :
      </p>

      <select
        name="chronicles"
        id="chronicles"
        class="appearance-none bg-white border border-accent2
          text-accent2 px-4 py-2 pr-10 rounded-md
          shadow-sm cursor-pointer
          focus:outline-none focus:ring-2 focus:ring-accent1 focus:border-accent1
          transition-all duration-200"
      >
        <option value="">Tous</option>
      </select>
    </div>

    <div
      class="flex flex-col items-center gap-2 border border-accent2 py-3 px-4 rounded-md bg-white shadow-sm w-fit"
    >
      <p class="text-sm font-semibold text-accent2">
        Filtrer par utilisateur :
      </p>

      <select
        name="users"
        id="users"
        class="appearance-none bg-white border border-accent2
          text-accent2 px-4 py-2 pr-10 rounded-md
          shadow-sm cursor-pointer
          focus:outline-none focus:ring-2 focus:ring-accent1 focus:border-accent1
          transition-all duration-200"
      >
        <option value="">Tous</option>
      </select>
    </div>

    <button
      type="button"
      title="Réinitialiser les filtres"
      class="flex items-center justify-center
        w-12 h-12 rounded-full
        border border-accent2
        text-accent2 bg-white
        hover:bg-accent1 hover:text-white hover:border-accent1
        transition-all duration-300 shadow-sm"
    >
      <iconify-icon
        icon="material-symbols:restart-alt-rounded"
        class="text-2xl"
      ></iconify-icon>
    </button>
  </div>

  <ul class="space-y-2">
    @for (comment of comments(); track comment.id) {
      <li>
        <app-admin-comment-card
          [comment]="comment"
          (update)="updateComment($event)"
          (toggle)="toggleStatus($event)"
          (delete)="deleteComment($event)"
        />
      </li>
    } @empty {
      <li class="text-gray-500 text-center py-4">
        Aucun commentaire à afficher.
      </li>
    }
  </ul>

  <app-ui-messages />
</section>
