<section class="flex flex-col gap-6 mt-24 pb-8 border-b">
  <div class="flex flex-col border-b-2 border-accent2 py-2 items-center md:flex-row md:justify-between">
    <h2 class="text-2xl sm:text-4xl font-black text-center mb-4">
      Toutes les chroniques ({{ chronicles().length }})
    </h2>

    <app-ui-button
      label="Ajouter une chronique"
      (clicked)="createChronicle()"
    />   
  </div>

  <ul class="space-y-2">
    @for (chronicle of chronicles(); track chronicle.id) {
      <li>
        <app-admin-chronicle-card
          [chronicle]="chronicle"
          (delete)="deleteChronicle($event)"
          (toggle)="toggleStatus($event)"
          (update)="updateChronicle($event)"
        />
      </li>
    } @empty {
      <li class="text-gray-500 text-center py-4">
        Aucune chronique à afficher.
      </li>
    }
  </ul>

  <app-ui-messages />
</section>
