<section class="border p-4 rounded bg-white shadow">
  <div
    class="flex flex-col items-center gap-4 md:flex md:flex-row md:justify-between md:items-center"
  >
    <div class="flex flex-col items-center gap-2 sm:flex sm:flex-row">
      <p class="font-bold text-center">
        {{ chronicle().title }}
      </p>

      <p>
        publiée le :
        {{ chronicle().publishedAt | date: 'dd/MM/yyyy' }}
      </p>

      <div>
        @if (!chronicle().isActive) {
          <span class="text-red-600 font-bold border p-1">
            Inactive
          </span>
        }
      </div>
    </div>

    <div class="flex gap-4">
      <button type="button" (click)="handleUpdate()">
        <iconify-icon
          icon="material-symbols:edit"
          class="text-4xl p-1 border border-accent1 bg-white text-accent1 hover:bg-accent1 hover:text-white transition-all duration-500"
        ></iconify-icon>
      </button>

      <button type="button" (click)="handleToggle()">
        <iconify-icon
          [attr.icon]="
            chronicle().isActive
              ? 'mdi:toggle-switch'
              : 'mdi:toggle-switch-off'
          "
          class="text-4xl p-1 border border-accent1 bg-white text-accent1 hover:bg-accent1 hover:text-white transition-all duration-500"
        ></iconify-icon>
      </button>

      <button type="button" (click)="handleDelete()">
        <iconify-icon
          icon="material-symbols:delete-rounded"
          class="text-4xl p-1 border border-accent1 bg-white text-accent1 hover:bg-accent1 hover:text-white transition-all duration-500"
        ></iconify-icon>
      </button>
    </div>
  </div>
</section>
