<section
  class="flex flex-col items-center bg-accent2 text-white p-6 gap-8 mt-12 md:flex md:flex-row"
>
  <div class="shrink-0">
    <img
      src="/images/katia.webp"
      alt="auteur"
      class="w-50 lg:w-70"
    />
  </div>

  <div
    class="flex flex-col items-center gap-4 md:flex md:flex-col md:justify-around md:items-start"
  >
    <div
      class="w-2/3 flex flex-col gap-8 items-center md:flex md:flex-row md:items-start md:w-full"
    >
      <div class="flex-1 flex flex-col items-center justify-start gap-4">
        <div
          class="flex flex-col items-center gap-4 p-2 border-b border-t md:border-r md:border-t-0 md:border-b-0"
        >
          <h2 class="text-white text-3xl">
            A propos
          </h2>

          <p class="text-center md:text-start">
            Depuis toujours, j’explore les univers littéraires. Ce site est né de
            l’envie de partager mes lectures, mes analyses et mes coups de cœur.
            J’aime comprendre ce qui fait vibrer un texte, ce qui le rend unique.
          </p>

          <div class="flex flex-col items-center gap-4">
            <button
              type="button"
              class="border hover:text-accent2 hover:bg-white transition-all duration-500"
              (click)="goToAbout()"
            >
              En savoir plus
            </button>

            <a
              href="https://www.instagram.com/katiacampagne/"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Lien vers Instagram"
            >
              <iconify-icon
                icon="simple-icons:instagram"
                class="cursor-pointer text-2xl text-white hover:scale-115 hover:text-accent1 transition-all duration-500"
              ></iconify-icon>
            </a>
          </div>
        </div>
      </div>

      <div
        class="flex-1 flex flex-col items-center justify-start gap-4 text-center"
      >
        <h3 class="text-xl">
          Recevez les nouvelles publications
        </h3>

        <p>
          Pas de spam, juste du suspense.
        </p>

        <app-newsletter-form />
      </div>
    </div>
  </div>
</section>
