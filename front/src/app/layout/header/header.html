<header class="mb-6">
  <!-- Desktop -->
  <div class="hidden md:flex md:justify-between md:items-center md:p-2">
    <div class="p-2 flex gap-4">
      <span>Katia Campagne</span>

      <div class="relative group hidden md:inline-block">
        <a
          href="https://www.instagram.com/katiacampagne"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Lien vers Instagram"
        >
          <iconify-icon
            icon="simple-icons:instagram"
            class="cursor-pointer text-2xl text-accent2 hover:text-accent1 transition-all duration-500"
          ></iconify-icon>
        </a>

        <!-- Tooltip -->
        <span
          class="absolute left-1/2 -translate-x-1/2 mt-2 hidden group-hover:block whitespace-nowrap bg-black text-white text-xs px-2 py-1 rounded shadow-lg"
        >
          Peut nécessiter une connexion Instagram
        </span>
      </div>
    </div>

    <nav>
      <ul class="flex gap-1">
        <li
          class="p-2 hover:text-accent1 hover:underline hover:underline-offset-4 transition-all duration-500"
        >
        <a 
            routerLink="/" routerLinkActive="text-accent1 font-black"
            [routerLinkActiveOptions]="{ exact: true }">
            Accueil
        </a>
        </li>

        <li
          class="p-2 hover:text-accent1 hover:underline hover:underline-offset-4 transition-all duration-500"
        >
          <a routerLink="/books" routerLinkActive="text-accent1 font-black">Livres</a>
        </li>

        <li
          class="p-2 hover:text-accent1 hover:underline hover:underline-offset-4 transition-all duration-500"
        >
          <a routerLink="/chronicles" routerLinkActive="text-accent1 font-black">Chroniques</a>
        </li>

        <li
          class="p-2 hover:text-accent1 hover:underline hover:underline-offset-4 transition-all duration-500"
        >
          <a routerLink="/about" routerLinkActive="text-accent1 font-black">À propos</a>
        </li>

        <li
          class="p-2 hover:text-accent1 hover:underline hover:underline-offset-4 transition-all duration-500"
        >
          <a routerLink="/contact" routerLinkActive="text-accent1 font-black">Contact</a>
        </li>
        <li
          class="p-2 "
        >
          <app-account-menu />
        </li>

      </ul>
    </nav>
  </div>

  <!-- Mobile -->
  <div class="flex md:hidden justify-between items-center">
    <button 
        aria-label="Ouvrir le menu"
        (click)="isOpen.update(value => !value)"
    >
      <iconify-icon
        [icon]="isOpen() ? 'ri:close-line' : 'ri:menu-line'"
        class="text-3xl hover:border hover:border-accent1"
        ></iconify-icon>
    </button>

    <div class="p-2 flex gap-4">
      <span class="font-black text-xl">Katia Campagne</span>

      <a
        href="https://www.instagram.com/katiacampagne"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Lien vers Instagram"
      >
        <iconify-icon
          icon="simple-icons:instagram"
          class="cursor-pointer text-2xl text-accent2 hover:text-accent1 transition-all duration-500"
        ></iconify-icon>
      </a>
    </div>
    @if (isOpen()) {
        <nav class="absolute top-9 left-6 z-1000 md:hidden mt-2">
            <ul class="flex flex-col gap-2 p-2 bg-white border rounded-tr-lg rounded-br-lg shadow">
            <li class="p-2 hover:text-accent1">
                <a
                    routerLink="/"
                    routerLinkActive="text-accent1 font-black"
                    [routerLinkActiveOptions]="{ exact: true }"
                >
                Accueil
                </a>
            </li>

            <li class="p-2 hover:text-accent1">
                <a
                    routerLink="/bibliography"
                    routerLinkActive="text-accent1 font-black"
                >
                Livres
                </a>
            </li>

            <li class="p-2 hover:text-accent1">
                <a
                    routerLink="/chronicles"
                    routerLinkActive="text-accent1 font-black"
                >
                Chroniques
                </a>
            </li>

            <li class="p-2 hover:text-accent1">
                <a
                    routerLink="/about"
                    routerLinkActive="text-accent1 font-black"
                >
                À propos
                </a>
            </li>

            <li class="p-2 hover:text-accent1">
                <a
                    routerLink="/contact"
                    routerLinkActive="text-accent1 font-black"
                >
                Contact
                </a>
            </li>
            </ul>
        </nav>
    }
  </div>
</header>
